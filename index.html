<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cássio Ângelo | Links</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0f1c;
  color: #fff;
}

/* Layout geral */
.wrapper {
  display: flex;
  min-height: 100vh;
}

/* Lado esquerdo (boneco) */
.left {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.left img {
  max-width: 50%;
  animation: flutuar 3s ease-in-out infinite;
}

/* Animação leve */
@keyframes flutuar {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}

/* Lado direito */
.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  max-width: 400px;
  width: 90%;
  text-align: center;
}

/* Nome maior */
h1 {
  font-size: 50px;
  margin-bottom: 10px;
}

/* Subtítulo */
p {
  color: #aaa;
  margin-bottom: 25px;
}

/* Botões */
.link {
  display: block;
  text-decoration: none;
  background: #121a2b;
  color: #fff;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #1f2a44;
  transition: 0.3s;
}

.link:hover {
  background: #1f2a44;
  transform: scale(1.04);
}

/* WhatsApp destaque */
.whatsapp {
  background: #1f6f3d;
  border: none;
}

.whatsapp:hover {
  background: #2ecc71;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #666;
}
</style>

</head>

<body>

<div class="wrapper">

  <!-- Boneco -->
  <div class="left">
    <img src="meu boneco.png" alt="Cássio Avatar">
  </div>

  <!-- Conteúdo -->
  <div class="right">
    <div class="container">

      <h1>Cássio Ângelo</h1>
      <p>Tecnologia • IA • Segurança Digital • Desenvolvimento WEB</p>

      <a class="link" href="https://instagram.com/cassioangelos" target="_blank">Instagram</a>
      <a class="link" href="https://linkedin.com/in/cassioangelos" target="_blank">LinkedIn</a>
      <a class="link" href="https://github.com/cassioangelos" target="_blank">GitHub</a>
      <a class="link" href="https://youtube.com/@cassioangelos" target="_blank">YouTube</a>
      <a class="link" href="https://x.com/cassioangelos" target="_blank">X (Twitter)</a>

      <!-- WhatsApp -->
      <a class="link whatsapp" href="https://wa.me/5579998705157" target="_blank">
        Falar no WhatsApp
      </a>

      <div class="footer">
        © 2026 - Cássio Ângelo
      </div>

    </div>
  </div>

</div>

</body>
</html>
