<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cássio Ângelo | Links</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0f1c;
  color: #fff;
}

/* Layout padrão (mobile) */
.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

/* Boneco */
.left img {
  width: 180px;
  margin-bottom: 20px;
  animation: flutuar 3s ease-in-out infinite;
}

/* Animação */
@keyframes flutuar {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* Conteúdo */
.container {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

/* Nome */
h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

/* Sub */
p {
  color: #aaa;
  margin-bottom: 25px;
}

/* Links */
.link {
  display: block;
  text-decoration: none;
  background: #121a2b;
  color: #fff;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #1f2a44;
  transition: 0.3s;
}

.link:hover {
  background: #1f2a44;
}

/* WhatsApp */
.whatsapp {
  background: #1f6f3d;
}
.Email {
  background: blue;
}

/* Desktop */
@media (min-width: 768px) {
  .wrapper {
    flex-direction: row;
    justify-content: center;
  }

  .left, .right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .left img {
    width: 250px;
  }
}
</style>

</head>

<body>

<div class="wrapper">

  <div class="left">
    <img src="Meu boneco.png" alt="Avatar">
  </div>

  <div class="container">
    <h1>Cássio Ângelo</h1>
    <p>Tecnologia • IA • Dev • Segurança Digital</p>
    <a class="link" href="https://www.instagram.com/cassioangelos/">Instagram</a>
    <a class="link" href="https://www.linkedin.com/in/cassioangelos/">LinkedIn</a>
    <a class="link" href="https://github.com/cassioangelos">GitHub</a>
    <a class="link" href="https://www.youtube.com/@cassioangelos">YouTube</a>
    <a class="link" href="https://x.com/cassioangelos">X</a>
    <a class="link Email" href="mailto:cassioangelo@hotmail.com">Enviar E-mail</a>
    <a class="link whatsapp" href="https://wa.me/5579998705157">WhatsApp</a>
  </div>

</div>

</body>
</html>
